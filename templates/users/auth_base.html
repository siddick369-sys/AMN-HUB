{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12 relative overflow-hidden bg-gradient-to-br from-slate-50 via-white to-navy-50">

  <!-- Arrière-plan décoratif -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -right-32 w-80 h-80 bg-navy-100 rounded-full blur-3xl opacity-60 animate-pulse-slow"></div>
    <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-emerald-100 rounded-full blur-3xl opacity-50 animate-pulse-slow" style="animation-delay:1.5s"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-navy-50 rounded-full blur-3xl opacity-40"></div>
  </div>

  <!-- Carte centrale -->
  <div class="relative w-full max-w-md animate-fade-in">

    <!-- Logo & En-tête -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-navy-700 to-navy-500 mb-4 shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-navy-700">AMN Employee Hub</h1>
      <p class="text-sm text-slate-400 mt-1">Africa Mobile Networks</p>
    </div>

    <!-- Sélecteur de langue -->
    <div class="flex justify-center gap-2 mb-6">
      <form action="{% url 'set_language' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}" />
        <div class="flex gap-1 bg-white border border-slate-200 rounded-xl p-1 shadow-sm">
          <button type="submit" name="language" value="fr"
                  class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all
                  {% if LANGUAGE_CODE == 'fr' %}bg-navy-700 text-white shadow-sm{% else %}text-slate-400 hover:text-navy-600{% endif %}">
            FR
          </button>
          <button type="submit" name="language" value="en"
                  class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all
                  {% if LANGUAGE_CODE == 'en' %}bg-navy-700 text-white shadow-sm{% else %}text-slate-400 hover:text-navy-600{% endif %}">
            EN
          </button>
        </div>
      </form>
    </div>

    <!-- Carte principale -->
    <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-100">
      {% block auth_content %}{% endblock %}
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 mt-6">
      © {% now "Y" %} Africa Mobile Networks · {% translate "Tous droits réservés" %}
    </p>

  </div>
</div>
{% endblock %}
